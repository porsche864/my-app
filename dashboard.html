<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img/icon.jpg">
    <title>Dashboard - RootKit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="dash-sidebar">
            <div class="sidebar-top">
                <a href="index.html" class="sidebar-brand">
                    <div class="brand-avatar" id="avatar">U</div>
                </a>
                <nav class="sidebar-nav">
                    <a href="home.html" class="nav-icon" title="Go to Home"><i class="fa-solid fa-house"></i></a>
                    <a href="dashboard.html" class="nav-icon active" title="Dashboard"><i class="fa-solid fa-border-all"></i></a>
                    <a href="ctf-home.html" class="nav-icon" title="CTF Changer"><i class="fa-solid fa-flag"></i></a>
                    <a href="terminal.html" class="nav-icon" title="Online Terminal"><i class="fa-solid fa-terminal"></i></a>
                    <a href="shop.html" class="nav-icon" title="Shop"><i class="fa-solid fa-cart-shopping"></i></a>
                    <a href="project.html" class="nav-icon" title="Projects"><i class="fa-solid fa-folder-open"></i></a>
                </nav>
            </div>
            <div class="sidebar-bottom">
                <button id="btn-sidebar-settings" class="nav-icon" title="Settings"><i class="fa-solid fa-gear"></i></button>
                <button id="btn-logout" class="nav-icon logout-btn" title="Log Out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Dashboard Workspace -->
        <div class="dash-workspace">
            <header class="dash-header">
                <h2>User Dashboard</h2>
            </header>

            <div class="dash-grid" style="grid-template-columns: 1fr; max-width: 500px;">
                <!-- User Profile Card -->
                <div class="dash-card user-profile-card">
                    <div class="profile-info">
                        <div class="profile-avatar-img">
                            <i class="fa-solid fa-user-gear"></i>
                        </div>
                        <div>
                            <h4 id="profile-username">User</h4>
                            <p id="detail-email">User Email</p>
                        </div>
                    </div>
                    <!-- Click Edit to show settings card below -->
                    <button id="btn-edit-account" class="btn-edit-account" title="Edit Profile">
                        <i class="fa-solid fa-user-pen"></i> Edit
                    </button>
                </div>

                <!-- Account Settings Details (Hidden by default) -->
                <div class="dash-card settings-card-hidden" id="account-settings-card">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Edit Account Details</h3>
                        <button id="btn-close-settings" style="background: none; border: none; font-size: 1.1rem; color: #a0aec0; cursor: pointer;">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Edit Full Name Form -->
                    <form id="edit-profile-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px; margin-bottom: 25px;">
                        <label style="font-size: 0.85rem; color: #4a5568; font-weight: 600;">Full Name</label>
                        <div class="search-box" style="width: 100%; border: 1px solid #e2e8f0;">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="edit-fullname" placeholder="Enter full name" required>
                        </div>
                        <button type="submit" class="modal-btn modal-btn-confirm" style="background-color: #00a8b5; align-self: flex-start;">
                            <i class="fa-solid fa-pen"></i> Save Name
                        </button>
                    </form>

                    <hr style="border: none; border-top: 1px solid #edf2f7; margin-bottom: 25px;">

                    <!-- Update Password Form -->
                    <form id="update-pass-form" style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="font-size: 0.85rem; color: #4a5568; font-weight: 600;">New Password</label>
                        <div class="search-box" style="width: 100%; border: 1px solid #e2e8f0;">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="new-password" placeholder="Min. 6 characters" required minlength="6">
                        </div>
                        <button type="submit" class="modal-btn modal-btn-confirm" style="background-color: #ff9f1c; align-self: flex-start;">
                            <i class="fa-solid fa-key"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
