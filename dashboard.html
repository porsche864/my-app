<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RootKit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-name">
            <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="img/logo.png" alt="Logo">
                <span>RootKit</span>
            </a>
        </div>
        <div class="header-right">
            <button id="btn-logout" class="start-link" style="cursor: pointer;">
                <i class="fa-solid fa-sign-out-alt"></i> Log Out
            </button>
        </div>
    </header>
    
    <main class="form-main">
        <div class="form-container" style="max-width: 600px; text-align: center;">
            <div style="margin-bottom: 25px;">
                <div id="avatar" style="width: 80px; height: 80px; background-color: var(--btn-bg); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; margin: 0 auto 15px auto;">U</div>
                <h2 id="profile-username" style="font-size: 2rem; color: var(--heading-color);">Welcome</h2>
                <p class="form-subtitle">You are successfully logged into your RootKit dashboard.</p>
            </div>
            
            <div style="background-color: var(--input-bg); padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: left;">
                <h3 style="color: var(--heading-color); margin-bottom: 10px; font-size: 1.1rem;">
                    <i class="fa-solid fa-rocket" style="color: var(--btn-bg); margin-right: 8px;"></i> Quick Overview
                </h3>
                <p style="font-size: 0.9rem; color: var(--short-note-color); line-height: 1.5;">
                    Access your digital tools, manage your step-by-step manuals, and explore secure execution paths from here.
                </p>
            </div>

            <a href="index.html" class="form-submit-btn" style="display: inline-block; text-decoration: none; text-align: center; line-height: normal;">
                GO TO HOME
            </a>
        </div>
    </main>

    <!-- Firebase Auth Guard Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4uUnjwEcVNVn0Sd6KzuMxBiQW2QTzyks",
            authDomain: "chat-b56a0.firebaseapp.com",
            projectId: "chat-b56a0",
            storageBucket: "chat-b56a0.firebasestorage.app",
            messagingSenderId: "928517534314",
            appId: "1:928517534314:web:adeb5fc7c8ae090dfad013",
            measurementId: "G-MX1MJC4TCN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const profileUsername = document.getElementById("profile-username");
        const avatar = document.getElementById("avatar");
        const btnLogout = document.getElementById("btn-logout");

        // Protect dashboard: Redirect to auth.html if user is not logged in
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "auth.html";
            } else {
                try {
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("uid", "==", user.uid));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        const userData = querySnapshot.docs[0].data();
                        const displayName = userData.fullName || userData.username || user.email;
                        profileUsername.textContent = `Welcome, ${displayName}`;
                        avatar.textContent = displayName.charAt(0).toUpperCase();
                    } else {
                        profileUsername.textContent = `Welcome, ${user.email}`;
                        avatar.textContent = user.email.charAt(0).toUpperCase();
                    }
                } catch (err) {
                    console.error("Error loading profile data:", err);
                }
            }
        });

        // Handle logout
        btnLogout.addEventListener("click", async () => {
            if (confirm("Are you sure you want to log out?")) {
                try {
                    await signOut(auth);
                    window.location.href = "auth.html";
                } catch (err) {
                    console.error("Logout error:", err);
                }
            }
        });
    </script>
</body>
</html>
